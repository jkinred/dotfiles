# =============================================================
# Plugins (TPM)
# =============================================================
# To update hashes after `prefix + U`:
#   for d in ~/.tmux/plugins/*/; do printf '%s %s\n' "$(basename "$d")" "$(git -C "$d" rev-parse HEAD)"; done

set -g @plugin 'tmux-plugins/tpm#99469c4a9b1ccf77fade25842dc7bafbc8ce9946'
set -g @plugin 'tmux-plugins/tmux-sensible#25cb91f42d020f675bb0a2ce3fbd3a5d96119efa'
set -g @plugin 'tmux-plugins/tmux-yank#acfd36e4fcba99f8310a7dfb432111c242fe7392'
set -g @plugin 'azorng/tmux-smooth-scroll#e7f0b489d28f85e5a4e90d1aae335ac390159657'
set -g @plugin 'jaclu/tmux-power-zoom#f3be607863839c96a8472cb3ac3cda9a86c062a7'
set -g @plugin 'roosta/tmux-fuzzback#0aafeeec4555d7b44a5a2a8252f29c238d954d59'
set -g @plugin 'tony-sol/tmux-kubectx#54d5e9050e5a2bc5d1e695657a04aaef13b5e47e'
set -g @plugin 'catppuccin/tmux' #8b0b9150f9d7dee2a4b70cdb50876ba7fd6d674a'

# Plugin settings.
set -g @fuzzback-popup 0
set -g @fuzzback-hide-preview 0

run '~/.tmux/plugins/tpm/tpm'

