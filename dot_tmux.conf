# =============================================================
# Prefix & Core Keybinding
# =============================================================

unbind-key C-b
set-option -g prefix C-Space
bind-key C-Space last-window
unbind-key -T prefix Space

# =============================================================
# Environment
# =============================================================

set-option -g update-environment \
  "DISPLAY WAYLAND_DISPLAY SSH_AUTH_SOCK"

# =============================================================
# General Options
# =============================================================

set -g repeat-time 1000
set-option -g history-limit 100000
set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g set-titles on
set-window-option -g monitor-activity on
set-window-option -g automatic-rename off
set-window-option -g allow-rename off

# =============================================================
# Mouse
# =============================================================

set-option -g mouse on

# =============================================================
# Vi-Style Navigation & Editing
# =============================================================

# Copy/choice mode.
set-window-option -g mode-keys vi

# Pane navigation.
unbind-key j; bind-key j select-pane -D
unbind-key k; bind-key k select-pane -U
unbind-key h; bind-key h select-pane -L
unbind-key l; bind-key l select-pane -R

# Copy/paste.
bind-key -T copy-mode-vi 'V' send-keys -X begin-selection
unbind-key ]
bind-key 'p' paste-buffer
bind-key 'P' previous-window
# bind-key '/' copy-mode \; send-keys '?'
bind-key '/' "copy-mode \; send-keys '?'"

# =============================================================
# Theme (Catppuccin)
# =============================================================

set-hook -g client-dark-theme "set -g @catppuccin_flavor 'mocha' \; run ~/.tmux/plugins/catpuccin/tmux/catppuccin.tmux"
set-hook -g client-light-theme "set -g @catppuccin_flavor 'latte' \; run ~/.tmux/plugins/catpuccin/tmux/catppuccin.tmux"

set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_kube_context_color "#{@thm_red}"
set -g @catppuccin_kube_namespace_color "#{@thm_sky}"

run ~/.tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right ""
